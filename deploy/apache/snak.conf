# Apache vhost template for snak (development).
# Install: symlink into /etc/apache2/sites-available, a2ensite snak, reload.
<VirtualHost *:80>
    ServerName snak.local
    ServerAlias www.snak.local

    DocumentRoot /var/www/html/snak/public

    <Directory /var/www/html/snak/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # CodeIgniter front controller; no mod_rewrite dependency.
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/snak-error.log
    CustomLog ${APACHE_LOG_DIR}/snak-access.log combined
</VirtualHost>
